<!DOCTYPE html>
<html>  
    <form>
        <label>Full Name: </label>
        <input type ="text"  name="fullname">
        
        <br><br>
        
        <label>Email: </label>
        <input type ="text"  name="email" placeholder="email@example.com">

        <br><br>

        <label>Password: </label>
        <input type ="password"  name="password">

        <br><br>

        <label>Age: </label>
        <input type ="number"  name="age"   min="5" max="100">

        <br><br>

        <label>Date of Birth: </label>
        <input type ="date"  name="dob">

        <br><br>

        <label>Gender: </label>
        <input type ="radio"  name="gender" value="Male">Male
        <input type ="radio"  name="gender" value="Female">Female
        <input type ="radio"  name="gender" value="Other">Other

        <br><br>

        <label>City:</label>
        <select name="city">
        <option value="dhaka">Dhaka</option>
        <option value="khulna">Khulna</option>
        <option value="rajshahi">Rajshahi</option>
        <option value="sylhet">Sylhet</option>
        </select>

        <br><br>

        <label>Hobbies: </label>
        <input type="checkbox"  name:"Reading">Reading
        <input type="checkbox"  name:"Cricket">Cricket
        <input type="checkbox"  name:"Music">Music

        <br><br>

        <label>About Yourself: </label>
        <br>
        <textarea name="Write here" row="3" cols="50"></textarea>

        <br><br>

        <button>Submit</button>
        <button>Reset</button>

    </form>
</html>
